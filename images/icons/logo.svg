<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E31E24"/>
      <stop offset="100%" style="stop-color:#FF3333"/>
    </linearGradient>
  </defs>
  <!-- Speaker icon -->
  <g transform="translate(5, 10)">
    <rect x="0" y="10" width="15" height="30" rx="2" fill="url(#logoGradient)"/>
    <polygon points="15,15 35,0 35,50 15,35" fill="url(#logoGradient)"/>
    <!-- Sound waves -->
    <path d="M40,15 Q50,25 40,35" stroke="#E31E24" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M45,8 Q60,25 45,42" stroke="#E31E24" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M50,0 Q70,25 50,50" stroke="#E31E24" stroke-width="3" fill="none" opacity="0.4"/>
  </g>
  <!-- Text -->
  <text x="75" y="38" font-family="Montserrat, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">
    ТАТ<tspan fill="#E31E24">аудио</tspan>
  </text>
</svg>
